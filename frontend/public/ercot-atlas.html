<title>ERCOT Power Project Atlas</title>
<style>
/* ============================================================
   Apple-style neutral chrome. Grays and whites carry the UI;
   color is spent only where it encodes fuel type.
   Palettes validated all-pairs for CVD in both modes
   (light surface #EAEAEF, dark surface #1C1C1E).
   ============================================================ */
:root{
  color-scheme: light;

  /* neutrals - Apple system grays */
  --bg:#F2F2F7;             /* systemGray6 */
  --surface:#FFFFFF;
  --surface-2:#F2F2F7;
  --fill:#E9E9EB;           /* control track */
  --fill-2:#E5E5EA;         /* systemGray5 */
  --hairline:rgba(60,60,67,0.16);
  --hairline-soft:rgba(60,60,67,0.10);
  --ink:#000000;
  --ink-2:rgba(60,60,67,0.62);   /* secondaryLabel */
  --ink-3:rgba(60,60,67,0.36);   /* tertiaryLabel */
  --accent:#007AFF;              /* systemBlue */
  --accent-ink:#FFFFFF;
  --shadow-1:0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  --shadow-2:0 2px 6px rgba(0,0,0,.08), 0 14px 40px rgba(0,0,0,.10);
  --material:rgba(255,255,255,0.78);

  /* map */
  --map-bg:#F7F7FA;
  --map-land:#E7E7EE;
  --map-line:rgba(255,255,255,0.95);
  --map-ring:#E7E7EE;        /* gap colour between overlapping bubbles */
  --map-city:rgba(60,60,67,0.34);
  --map-city-ink:rgba(60,60,67,0.58);
  --map-sel:#000000;

  /* categorical fuel palette - light steps */
  --c-solar:#B47C00;
  --c-wind:#15703A;
  --c-storage:#7326BE;
  --c-gas:#CB0066;
  --c-nuclear:#4285CE;
  --c-coal:#5E5E63;
  --c-other:#A3A3AB;
  --c-neutral-bar:#8E8E93;

  --mono:ui-monospace,"SF Mono",Menlo,"Cascadia Mono",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",system-ui,sans-serif;
}

@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#000000;
    --surface:#1C1C1E;
    --surface-2:#2C2C2E;
    --fill:#2C2C2E;
    --fill-2:#3A3A3C;
    --hairline:rgba(255,255,255,0.16);
    --hairline-soft:rgba(255,255,255,0.09);
    --ink:#FFFFFF;
    --ink-2:rgba(235,235,245,0.62);
    --ink-3:rgba(235,235,245,0.34);
    --accent:#0A84FF;
    --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.4);
    --shadow-2:0 2px 8px rgba(0,0,0,.55), 0 16px 44px rgba(0,0,0,.5);
    --material:rgba(28,28,30,0.76);
    --map-bg:#000000;
    --map-land:#1C1C1E;
    --map-line:rgba(255,255,255,0.13);
    --map-ring:#1C1C1E;
    --map-city:rgba(235,235,245,0.30);
    --map-city-ink:rgba(235,235,245,0.5);
    --map-sel:#FFFFFF;
    --c-solar:#C78403;
    --c-wind:#1F8A52;
    --c-storage:#A855E8;
    --c-gas:#E5397F;
    --c-nuclear:#6C90DA;
    --c-coal:#AEAEB4;
    --c-other:#6E6E77;
    --c-neutral-bar:#8E8E93;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#000000;
  --surface:#1C1C1E;
  --surface-2:#2C2C2E;
  --fill:#2C2C2E;
  --fill-2:#3A3A3C;
  --hairline:rgba(255,255,255,0.16);
  --hairline-soft:rgba(255,255,255,0.09);
  --ink:#FFFFFF;
  --ink-2:rgba(235,235,245,0.62);
  --ink-3:rgba(235,235,245,0.34);
  --accent:#0A84FF;
  --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.4);
  --shadow-2:0 2px 8px rgba(0,0,0,.55), 0 16px 44px rgba(0,0,0,.5);
  --material:rgba(28,28,30,0.76);
  --map-bg:#000000;
  --map-land:#1C1C1E;
  --map-line:rgba(255,255,255,0.13);
  --map-ring:#1C1C1E;
  --map-city:rgba(235,235,245,0.30);
  --map-city-ink:rgba(235,235,245,0.5);
  --map-sel:#FFFFFF;
  --c-solar:#C78403;
  --c-wind:#1F8A52;
  --c-storage:#A855E8;
  --c-gas:#E5397F;
  --c-nuclear:#6C90DA;
  --c-coal:#AEAEB4;
  --c-other:#6E6E77;
}
:root[data-theme="light"]{ color-scheme: light; }

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;font-size:13px;letter-spacing:-0.005em;
}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0;}
button{font-family:inherit;color:inherit;}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion: reduce){*{transition-duration:.001ms !important;animation-duration:.001ms !important;}}

/* ---------- shell ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;}
.topbar{
  height:52px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--material);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--hairline-soft);z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;margin-right:2px;}
.brand-mark{
  width:26px;height:26px;border-radius:7px;flex:none;
  background:linear-gradient(180deg,#6E6E77,#3A3A3C);
  display:flex;align-items:center;justify-content:center;
}
.brand-mark::after{
  content:"";width:11px;height:11px;border-radius:2px;
  background:var(--surface);clip-path:polygon(52% 0,0 60%,42% 60%,34% 100%,100% 38%,54% 38%);
}
.brand-t{font-size:14px;font-weight:600;letter-spacing:-0.015em;white-space:nowrap;}
.brand-s{font-size:11px;color:var(--ink-3);margin-top:-1px;white-space:nowrap;}

/* Apple segmented control */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;}
.seg button{
  border:none;background:transparent;color:var(--ink);font-size:13px;font-weight:500;
  padding:5px 15px;border-radius:7px;cursor:pointer;transition:background .18s ease, box-shadow .18s ease;
}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12), 0 0 0 0.5px rgba(0,0,0,.04);font-weight:590;}
.spacer{flex:1;}

.search{position:relative;z-index:4;margin:10px 10px 4px;flex:none;}
.search input{
  width:100%;background:var(--fill);border:none;border-radius:9px;
  padding:8px 11px 8px 30px;color:var(--ink);font-size:13px;font-family:inherit;outline:none;
  transition:box-shadow .15s ease;
}
.search input:focus{box-shadow:0 0 0 3.5px color-mix(in srgb, var(--accent) 22%, transparent);}
.search input::placeholder{color:var(--ink-3);}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;}
.results{
  position:absolute;top:40px;left:0;width:100%;max-height:340px;overflow-y:auto;z-index:60;
  background:var(--surface);border:1px solid var(--hairline-soft);border-radius:12px;
  box-shadow:var(--shadow-2);padding:5px;
}
.results .r{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;}
.results .r:hover{background:var(--fill);}
.rname{font-size:13px;font-weight:500;}
.rmeta{font-size:11.5px;color:var(--ink-3);}

/* ---------- views ---------- */
.view{flex:1;min-height:0;position:relative;}
.view[hidden]{display:none;}
#mapwrap{position:absolute;inset:0;}
canvas{display:block;width:100%;height:100%;cursor:grab;}
canvas.drag{cursor:grabbing;}

.panel{
  background:var(--surface);border:1px solid var(--hairline-soft);
  border-radius:14px;box-shadow:var(--shadow-1);
}
.p-left{
  position:absolute;top:14px;left:14px;width:238px;z-index:20;max-height:calc(100% - 28px);
  display:flex;flex-direction:column;overflow:hidden;
}
.p-left::after{
  content:"";position:absolute;left:1px;right:1px;bottom:1px;height:24px;pointer-events:none;
  background:linear-gradient(to top,var(--surface),transparent);border-radius:0 0 13px 13px;
}
.p-right{position:absolute;top:14px;right:14px;width:326px;z-index:20;max-height:calc(100% - 28px);overflow-y:auto;}
.p-bottom{position:absolute;left:266px;bottom:14px;z-index:15;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 266px - 352px);}

.phead{padding:13px 15px 10px;display:flex;align-items:center;justify-content:space-between;}
.ptitle{font-size:12px;font-weight:590;letter-spacing:-0.01em;color:var(--ink);}
.ptitle.sub{color:var(--ink-3);font-weight:500;font-family:var(--mono);font-variant-numeric:tabular-nums;}
.pbody{padding:0 11px 12px;overflow-y:auto;min-height:0;flex:1;}
.pbody::-webkit-scrollbar{width:8px;}
.pbody::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:8px;border:2px solid transparent;background-clip:padding-box;}
.pbody::-webkit-scrollbar-track{background:transparent;}

.hint{font-size:11.5px;color:var(--ink-3);padding:0 5px 8px;line-height:1.4;}

.legrow{
  display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:8px;cursor:pointer;
  transition:background .13s;user-select:none;
}
.legrow:hover{background:var(--fill);}
.legrow.off .legname,.legrow.off .legmw{color:var(--ink-3);}
.legrow.off .dot{opacity:.3;}
.dot{width:10px;height:10px;border-radius:50%;flex:none;}
.legname{font-size:13px;flex:1;}
.legmw{font-size:11.5px;color:var(--ink-2);font-family:var(--mono);font-variant-numeric:tabular-nums;}
.tick{width:13px;flex:none;color:var(--accent);opacity:0;}
.legrow:not(.off) .tick{opacity:1;}

.ctl{margin-top:13px;padding-top:12px;border-top:1px solid var(--hairline-soft);}
.ctl-l{font-size:12px;color:var(--ink-2);font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between;padding:0 5px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 3px;}
.chip{
  padding:5px 11px;border-radius:16px;font-size:12px;font-weight:500;
  border:1px solid var(--hairline-soft);background:transparent;color:var(--ink-3);
  cursor:pointer;transition:background .13s, color .13s, border-color .13s;user-select:none;
}
.chip:hover{color:var(--ink-2);border-color:var(--hairline);}
.chip.on{background:var(--fill);color:var(--ink);border-color:transparent;font-weight:500;}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0;}

.stat{padding:10px 14px;min-width:100px;}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;letter-spacing:-0.02em;}
.stat .l{font-size:11px;color:var(--ink-3);margin-top:1px;white-space:nowrap;}

/* detail card */
.d-head{padding:16px 16px 13px;border-bottom:1px solid var(--hairline-soft);}
.d-name{font-size:17px;font-weight:600;letter-spacing:-0.02em;line-height:1.24;}
.d-sub{font-size:12.5px;color:var(--ink-2);margin-top:3px;}
.d-close{
  border:none;background:var(--fill);color:var(--ink-2);cursor:pointer;width:24px;height:24px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
}
.d-close:hover{background:var(--fill-2);color:var(--ink);}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:16px;font-size:12px;font-weight:500;background:var(--fill);}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--hairline-soft);font-size:13px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--ink-2);white-space:nowrap;}
.kv .v{text-align:right;font-weight:500;}
.note{
  font-size:12px;color:var(--ink-2);line-height:1.5;background:var(--surface-2);
  border-radius:10px;padding:10px 12px;margin-top:12px;
}
.note b{color:var(--ink);font-weight:590;}

#tip{
  position:fixed;pointer-events:none;z-index:70;background:var(--surface);border:1px solid var(--hairline-soft);
  border-radius:10px;padding:8px 11px;font-size:12.5px;box-shadow:var(--shadow-2);
  max-width:260px;opacity:0;transition:opacity .1s;
}
#tip.on{opacity:1;}
.tip-n{font-weight:590;margin-bottom:2px;}
.tip-m{color:var(--ink-2);font-size:11.5px;}

/* ---------- outlook ---------- */
#outlook{overflow-y:auto;padding:28px 28px 72px;}
.wrap{max-width:1120px;margin:0 auto;}
h1{font-size:26px;font-weight:640;letter-spacing:-0.028em;margin:0 0 6px;text-wrap:balance;}
.lede{font-size:14px;color:var(--ink-2);line-height:1.58;max-width:68ch;margin:0 0 22px;}
h2{font-size:17px;font-weight:600;margin:30px 0 4px;letter-spacing:-0.02em;}
.sec-sub{font-size:13px;color:var(--ink-2);margin:0 0 14px;line-height:1.55;max-width:72ch;}
.card{background:var(--surface);border:1px solid var(--hairline-soft);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow-1);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.hero{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-end;}
.hero .h-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:32px;font-weight:600;letter-spacing:-0.035em;line-height:1;}
.hero .h-l{font-size:12px;color:var(--ink-2);margin-top:6px;}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{
  text-align:left;font-size:11.5px;color:var(--ink-3);font-weight:500;
  padding:0 10px 9px 0;border-bottom:1px solid var(--hairline-soft);
}
.tbl td{padding:9px 10px 9px 0;border-bottom:1px solid var(--hairline-soft);vertical-align:top;}
.tbl tr:last-child td{border-bottom:none;}
.tbl .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;}
.scroll-x{overflow-x:auto;}
.wt{display:grid;grid-template-columns:1fr 132px 44px;gap:12px;align-items:center;padding:6px 0;}
.wt-l{font-size:13px;}
.wt-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right;color:var(--ink-2);}
.btn{
  border:none;background:var(--fill);border-radius:9px;padding:8px 15px;
  font-size:13px;font-weight:500;cursor:pointer;transition:background .14s;
}
.btn:hover{background:var(--fill-2);}
.btn.primary{background:var(--accent);color:#fff;}
.btn.primary:hover{filter:brightness(1.06);}
.legend-inline{display:flex;gap:15px;flex-wrap:wrap;margin:0 0 13px;}
.legend-inline .li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);}
.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--hairline-soft);font-size:12px;color:var(--ink-3);line-height:1.65;}
.foot b{color:var(--ink-2);font-weight:590;}
svg .gridline{stroke:var(--hairline-soft);stroke-width:1;}
svg text{fill:var(--ink-3);font-size:11px;font-family:var(--sans);}
svg text.val{fill:var(--ink-2);font-family:var(--mono);}
.bar-seg{transition:opacity .13s;}
.bar-seg:hover{opacity:.75;}

@media (max-width:900px){
  .p-left{display:none;}
  .p-right{width:auto;left:14px;right:14px;}
  .grid2{grid-template-columns:1fr;}
  .p-bottom{left:14px;max-width:calc(100% - 28px);}
  .brand-s{display:none;}
}

</style>

</div>

const TYPE_VAR = {
  solar:'--c-solar', wind:'--c-wind', storage:'--c-storage',
  gas:'--c-gas', coal:'--c-coal', nuclear:'--c-nuclear', other:'--c-other',
};
const TYPE_COLOR = {};
const THEME = {};
function refreshTheme() {
  const cs = getComputedStyle(document.documentElement);
  for (const t in TYPE_VAR) TYPE_COLOR[t] = cs.getPropertyValue(TYPE_VAR[t]).trim();
  for (const k of ['map-bg','map-land','map-line','map-ring','map-city','map-city-ink','map-sel','ink-3'])
    THEME[k] = cs.getPropertyValue('--' + k).trim();
}
const TYPE_LABEL = {
  solar:'Solar', wind:'Wind', storage:'Storage', gas:'Natural gas',
  coal:'Coal', nuclear:'Nuclear', other:'Other',
};
// display order = fixed categorical slot order, never cycled
const TYPES = ['solar','wind','storage','gas','coal','nuclear','other'];
const GROUP = { hydro:'other', oil:'other' };
// keyed off TYPE_VAR, not TYPE_COLOR: TYPE_COLOR is filled in from CSS at boot,
// so testing it here would classify everything as "other"
const grp = (t) => GROUP[t] || (TYPE_VAR[t] ? t : 'other');

const STATUS_LABEL = {
  operating:'Operating', queue:'Interconnection queue',
  planned:'Planned (EIA)', retired:'Retired',
};
const STAGE_ORDER = [
  'synchronized','energization_approved','under_construction',
  'ia_signed_studies_done','ia_signed','studies_done','studies_underway','early_screening',
];
const STAGE_LABEL = {
  synchronized:'Synchronized', energization_approved:'Energization approved',
  under_construction:'Under construction', ia_signed_studies_done:'IA signed + studies done',
  ia_signed:'IA signed', studies_done:'Studies done, no IA',
  studies_underway:'Studies underway', early_screening:'Early screening',
};
// Heuristic completion probabilities. Basis: later interconnection milestones
// correlate strongly with reaching commercial operation (LBNL "Queued Up" finds
// ~1 in 5 queued projects nationally get built; ERCOT's connect-and-manage
// regime runs higher). These are assumptions, not an ERCOT forecast &mdash; tune them.
const DEFAULT_W = {
  synchronized:0.97, energization_approved:0.92, under_construction:0.88,
  ia_signed_studies_done:0.62, ia_signed:0.52, studies_done:0.28,
  studies_underway:0.14, early_screening:0.06,
};
let W = { ...DEFAULT_W };

const CITIES = [
  ['Houston',-95.37,29.76],['Dallas',-96.80,32.78],['Austin',-97.74,30.27],
  ['San Antonio',-98.49,29.42],['Fort Worth',-97.33,32.76],['Corpus Christi',-97.40,27.80],
  ['Lubbock',-101.86,33.58],['Midland',-102.08,32.00],['Amarillo',-101.83,35.22],
  ['Waco',-97.15,31.55],['Abilene',-99.73,32.45],['Laredo',-99.51,27.51],
  ['El Paso',-106.49,31.76],['Brownsville',-97.50,25.90],
];

/* ============ state ============ */
const P = DATA.projects.map((p) => ({ ...p, ty: grp(p.ty) }));
const state = {
  types: new Set(TYPES),
  statuses: new Set(['operating','queue']),
  stages: new Set(STAGE_ORDER),
  minmw: 0,
  sel: null,
  hover: null,
};

const fmt = (n) => n >= 10000 ? Math.round(n).toLocaleString()
  : n >= 100 ? Math.round(n).toLocaleString()
  : n >= 10 ? n.toFixed(0) : n.toFixed(1);
const gw = (n) => (n / 1000).toFixed(n >= 10000 ? 0 : 1) + ' GW';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function visible() {
  return P.filter((p) =>
    state.types.has(p.ty) &&
    state.statuses.has(p.st) &&
    p.mw >= state.minmw &&
    (p.st !== 'queue' || state.stages.has(p.stage)));
}

/* ============ map ============ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let VIEW = { clon:-99.4, clat:31.3, k:46 };  // k = px per degree longitude-equivalent
let dpr = 1, CW = 0, CH = 0;
const COSLAT = Math.cos(31.3 * Math.PI / 180);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  CW = r.width; CH = r.height;
  cv.width = Math.round(CW * dpr); cv.height = Math.round(CH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
const px = (lon) => (lon - VIEW.clon) * VIEW.k * COSLAT + CW / 2;
const py = (lat) => -(lat - VIEW.clat) * VIEW.k + CH / 2;
const unlon = (x) => (x - CW / 2) / (VIEW.k * COSLAT) + VIEW.clon;
const unlat = (y) => -(y - CH / 2) / VIEW.k + VIEW.clat;

function fitTexas() {
  const b = { w:-106.9, e:-93.3, s:25.6, n:36.8 };
  // leave room for the filter panel on the left so Texas sits in the free space
  const gutter = CW > 900 ? 250 : 0;
  const kx = (CW - gutter - 24) / ((b.e - b.w) * COSLAT), ky = CH / (b.n - b.s);
  VIEW.k = Math.min(kx, ky) * 0.95;
  VIEW.clon = (b.w + b.e) / 2; VIEW.clat = (b.s + b.n) / 2;
  VIEW.clon -= (gutter / 2) / (VIEW.k * COSLAT);
}

function radiusFor(mw) {
  const zf = Math.pow(VIEW.k / 46, 0.38);
  return Math.max(1.5, Math.min(34, Math.sqrt(Math.max(mw, 0.4)) * 0.27 * zf));
}

function draw() {
  ctx.clearRect(0, 0, CW, CH);
  ctx.fillStyle = THEME['map-bg'];
  ctx.fillRect(0, 0, CW, CH);

  // county land + hairline borders
  ctx.lineWidth = 1;
  ctx.strokeStyle = THEME['map-line'];
  ctx.fillStyle = THEME['map-land'];
  ctx.beginPath();
  for (const name in DATA.counties) {
    for (const ring of DATA.counties[name].r) {
      for (let i = 0; i < ring.length; i++) {
        const x = px(ring[i][0]), y = py(ring[i][1]);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
    }
  }
  ctx.fill(); ctx.stroke();

  // bubbles &mdash; large first so small ones stay clickable on top
  const vis = visible().slice().sort((a, b) => b.mw - a.mw);
  for (const p of vis) {
    const x = px(p.lon), y = py(p.lat), r = radiusFor(p.mw);
    if (x < -60 || x > CW + 60 || y < -60 || y > CH + 60) continue;
    const c = TYPE_COLOR[p.ty] || TYPE_COLOR.other;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
    // surface ring first: the fill covers its inner half, leaving a dark gap
    // between overlapping marks so dense clusters stay readable
    ctx.globalAlpha = 0.9; ctx.strokeStyle = THEME['map-ring'];
    ctx.lineWidth = r > 3 ? 2.4 : 1.4; ctx.stroke();
    ctx.globalAlpha = p.st === 'operating' ? 0.42 : p.st === 'retired' ? 0.12 : 0.2;
    ctx.fillStyle = c; ctx.fill();
    ctx.globalAlpha = p.st === 'retired' ? 0.34 : p.st === 'operating' ? 1 : 0.8;
    ctx.lineWidth = p.st === 'operating' ? 1.4 : 1;
    ctx.strokeStyle = c;
    if (p.st === 'queue') ctx.setLineDash([2.2, 2.0]);
    ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;

  // city reference labels
  ctx.font = '500 11px ' + getComputedStyle(document.body).fontFamily;
  for (const [nm, lo, la] of CITIES) {
    const x = px(lo), y = py(la);
    if (x < 0 || x > CW || y < 0 || y > CH) continue;
    ctx.fillStyle = THEME['map-city'];
    ctx.beginPath(); ctx.arc(x, y, 2, 0, 6.2832); ctx.fill();
    ctx.fillStyle = THEME['map-city-ink'];
    ctx.fillText(nm, x + 6, y + 3.6);
  }

  // selection ring
  const s = state.sel;
  if (s) {
    const x = px(s.lon), y = py(s.lat), r = radiusFor(s.mw);
    ctx.beginPath(); ctx.arc(x, y, r + 5, 0, 6.2832);
    ctx.strokeStyle = THEME['map-ring']; ctx.lineWidth = 4; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, r + 5, 0, 6.2832);
    ctx.strokeStyle = THEME['map-sel']; ctx.lineWidth = 1.8; ctx.stroke();
  }
  drawScale();
}

function drawScale() {
  const targetPx = 96;
  const degLon = targetPx / (VIEW.k * COSLAT);
  const miles = degLon * 54.6;
  const nice = [10, 25, 50, 100, 200, 400, 800].reduce((a, b) => Math.abs(b - miles) < Math.abs(a - miles) ? b : a);
  const wpx = (nice / 54.6) * VIEW.k * COSLAT;
  const x0 = CW - wpx - 20, y0 = CH - 22;
  ctx.strokeStyle = THEME['map-city']; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0, y0 - 4); ctx.lineTo(x0, y0); ctx.lineTo(x0 + wpx, y0); ctx.lineTo(x0 + wpx, y0 - 4);
  ctx.stroke();
  ctx.fillStyle = THEME['map-city-ink'];
  ctx.font = '500 10px ' + getComputedStyle(document.body).fontFamily;
  ctx.fillText(nice + ' mi', x0 + wpx / 2 - 14, y0 - 7);
}

function hit(mx, my) {
  const vis = visible();
  let best = null, bestD = Infinity;
  for (const p of vis) {
    const x = px(p.lon), y = py(p.lat), r = radiusFor(p.mw);
    const d = Math.hypot(mx - x, my - y);
    const tol = Math.max(r, 5);
    if (d <= tol && d - r < bestD) { best = p; bestD = d - r; }
  }
  return best;
}

/* interactions */
let drag = null;
cv.addEventListener('mousedown', (e) => {
  drag = { x:e.clientX, y:e.clientY, clon:VIEW.clon, clat:VIEW.clat, moved:false };
  cv.classList.add('drag');
});
window.addEventListener('mousemove', (e) => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    VIEW.clon = drag.clon - dx / (VIEW.k * COSLAT);
    VIEW.clat = drag.clat + dy / VIEW.k;
    draw();
    return;
  }
  const r = cv.getBoundingClientRect();
  if (e.clientY < r.top || document.getElementById('mapview').hidden) return;
  const p = hit(e.clientX - r.left, e.clientY - r.top);
  const tip = document.getElementById('tip');
  if (p) {
    cv.style.cursor = 'pointer';
    tip.innerHTML = '<div class="tip-n">' + esc(p.n || '&mdash;') + '</div>'
      + '<div class="tip-m">' + esc(TYPE_LABEL[p.ty]) + ' &middot; <span class="mono">' + fmt(p.mw) + ' MW</span> &middot; '
      + esc(STATUS_LABEL[p.st]) + '</div>';
    tip.classList.add('on');
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tw - 8) + 'px';
    tip.style.top = Math.max(8, e.clientY - th - 12) + 'px';
  } else {
    cv.style.cursor = 'grab';
    tip.classList.remove('on');
  }
});
window.addEventListener('mouseup', (e) => {
  if (drag && !drag.moved) {
    const r = cv.getBoundingClientRect();
    const p = hit(e.clientX - r.left, e.clientY - r.top);
    select(p);
  }
  drag = null; cv.classList.remove('drag');
});
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const lon0 = unlon(mx), lat0 = unlat(my);
  const f = Math.exp(-e.deltaY * 0.0016);
  VIEW.k = Math.max(18, Math.min(4200, VIEW.k * f));
  VIEW.clon = lon0 - (mx - CW / 2) / (VIEW.k * COSLAT);
  VIEW.clat = lat0 + (my - CH / 2) / VIEW.k;
  draw();
}, { passive:false });
cv.addEventListener('dblclick', () => { fitTexas(); draw(); });

function select(p) {
  state.sel = p || null;
  renderDetail();
  draw();
}

/* ============ detail card ============ */
function renderDetail() {
  const el = document.getElementById('detail');
  const p = state.sel;
  if (!p) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  const c = TYPE_COLOR[p.ty];
  const rows = [];
  const R = (k, v) => rows.push('<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>');
  R('Capacity', '<span class="mono">' + fmt(p.mw) + '</span> MW');
  if (p.mwh) R('Energy', '<span class="mono">' + fmt(p.mwh) + '</span> MWh');
  R('Fuel type', esc(TYPE_LABEL[p.ty]));
  R('Status', esc(STATUS_LABEL[p.st]));
  if (p.o) R('Owner / entity', esc(p.o));
  if (p.co) R('County', esc(p.co) + ' County');
  if (p.z) R('ERCOT zone', esc(p.z));
  if (p.stage) R('Queue stage', esc(STAGE_LABEL[p.stage] || p.stage));
  if (p.poi) R('Point of interconnection', '<span class="mono" style="font-size:11.5px">' + esc(p.poi) + '</span>');
  if (p.yr) R('Online since', '<span class="mono">' + p.yr + '</span>');
  if (p.cod && p.st !== 'operating') R('Projected COD', '<span class="mono">' + p.cod + '</span>');
  if (p.units) R('Generating units', '<span class="mono">' + p.units + '</span>');
  if (p.st === 'queue') {
    const w = W[p.stage] ?? 0.2;
    R('Modelled completion odds', '<span class="mono">' + Math.round(w * 100) + '%</span>');
    R('Risk-adjusted MW', '<span class="mono">' + fmt(p.mw * w) + '</span> MW');
  }

  const precNote = p.prec === 'county'
    ? '<div class="note"><b>Approximate location.</b> ERCOT publishes queue projects at county level only &mdash; this dot is placed inside ' + esc(p.co) + ' County, not at the real site. Operating plants (solid dots) use exact EIA coordinates.</div>'
    : '';

  el.innerHTML =
    '<div class="d-head"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">'
    + '<div style="min-width:0"><div class="d-name">' + esc(p.n || 'Unnamed project') + '</div>'
    + '<div class="d-sub">' + esc(p.o || '') + '</div></div>'
    + '<button class="d-close" id="dclose" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>'
    + '</div><div style="margin-top:10px"><span class="badge" style="background:' + c + '22;color:' + c + '">'
    + '<span class="dot" style="background:' + c + ';width:7px;height:7px"></span>' + esc(TYPE_LABEL[p.ty]) + '</span></div></div>'
    + '<div class="pbody">' + rows.join('') + precNote + '</div>';
  document.getElementById('dclose').onclick = () => select(null);
}

/* ============ left panel ============ */
function renderLegend() {
  const vis = visible();
  const byType = {};
  for (const p of vis) byType[p.ty] = (byType[p.ty] || 0) + p.mw;
  const all = {};
  for (const p of P) if (state.statuses.has(p.st)) all[p.ty] = (all[p.ty] || 0) + p.mw;

  document.getElementById('legend').innerHTML =
    '<div class="hint">Nameplate MW across the statuses selected below. Tap a fuel to show or hide it.</div>'
    + TYPES.map((t) =>
    '<div class="legrow' + (state.types.has(t) ? '' : ' off') + '" data-t="' + t + '" role="checkbox" tabindex="0" aria-checked="' + state.types.has(t) + '">'
    + '<span class="dot" style="background:var(' + TYPE_VAR[t] + ')"></span>'
    + '<span class="legname">' + TYPE_LABEL[t] + '</span>'
    + '<span class="legmw">' + gw(all[t] || 0) + '</span>'
    + '<svg class="tick" width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    + '</div>').join('');

  document.querySelectorAll('.legrow').forEach((el) => {
    const go = () => {
      const t = el.dataset.t;
      if (state.types.has(t)) state.types.delete(t); else state.types.add(t);
      if (state.types.size === 0) TYPES.forEach((x) => state.types.add(x));
      renderAll();
    };
    el.onclick = go;
    el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });

  document.getElementById('mwtot').textContent = gw(vis.reduce((a, b) => a + b.mw, 0));
}

function renderChips() {
  const sc = document.getElementById('statuschips');
  sc.innerHTML = ['operating','queue','planned','retired'].map((s) =>
    '<div class="chip' + (state.statuses.has(s) ? ' on' : '') + '" data-s="' + s + '">' + STATUS_LABEL[s].replace(' (EIA)','').replace('Interconnection queue','Queue') + '</div>').join('');
  sc.querySelectorAll('.chip').forEach((el) => el.onclick = () => {
    const s = el.dataset.s;
    if (state.statuses.has(s)) state.statuses.delete(s); else state.statuses.add(s);
    if (!state.statuses.size) state.statuses.add('operating');
    renderAll();
  });

  const stc = document.getElementById('stagechips');
  const present = STAGE_ORDER.filter((s) => DATA.stage_mw[s]);
  stc.innerHTML = present.map((s) =>
    '<div class="chip' + (state.stages.has(s) ? ' on' : '') + '" data-g="' + s + '" title="' + STAGE_LABEL[s] + '">' + STAGE_LABEL[s] + '</div>').join('');
  stc.querySelectorAll('.chip').forEach((el) => el.onclick = () => {
    const g = el.dataset.g;
    if (state.stages.has(g)) state.stages.delete(g); else state.stages.add(g);
    if (!state.stages.size) present.forEach((x) => state.stages.add(x));
    renderAll();
  });
}

function renderStats() {
  const vis = visible();
  const sum = (f) => vis.filter(f).reduce((a, b) => a + b.mw, 0);
  const cards = [
    ['Projects shown', vis.length.toLocaleString(), ''],
    ['Operating', gw(sum((p) => p.st === 'operating')), ''],
    ['In queue', gw(sum((p) => p.st === 'queue')), ''],
    ['Risk-adjusted queue', gw(vis.filter((p) => p.st === 'queue').reduce((a, b) => a + b.mw * (W[b.stage] ?? 0.2), 0)), ''],
  ];
  document.getElementById('stats').innerHTML = cards.map(([l, v]) =>
    '<div class="panel stat"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>').join('');
}

function renderAll() {
  renderLegend(); renderChips(); renderStats(); draw();
  if (state.sel) renderDetail();
}

/* min-MW slider */
const mm = document.getElementById('minmw');
mm.oninput = () => {
  state.minmw = +mm.value;
  document.getElementById('minmwl').textContent = state.minmw + ' MW';
  renderAll();
};

/* ============ search ============ */
const qi = document.getElementById('q'), res = document.getElementById('results');
qi.addEventListener('input', () => {
  const v = qi.value.trim().toLowerCase();
  if (v.length < 2) { res.hidden = true; return; }
  const hits = P.filter((p) =>
    (p.n || '').toLowerCase().includes(v) ||
    (p.o || '').toLowerCase().includes(v) ||
    (p.co || '').toLowerCase().includes(v))
    .sort((a, b) => b.mw - a.mw).slice(0, 24);
  if (!hits.length) { res.hidden = true; return; }
  res.hidden = false;
  res.innerHTML = hits.map((p, i) =>
    '<div class="r" data-i="' + i + '"><span class="dot" style="background:' + TYPE_COLOR[p.ty] + '"></span>'
    + '<span style="flex:1;min-width:0"><div class="rname">' + esc(p.n || '&mdash;') + '</div>'
    + '<div class="rmeta">' + esc(p.co || '') + ' &middot; ' + esc(STATUS_LABEL[p.st]) + '</div></span>'
    + '<span class="rmeta mono">' + fmt(p.mw) + ' MW</span></div>').join('');
  res.querySelectorAll('.r').forEach((el) => el.onclick = () => {
    const p = hits[+el.dataset.i];
    state.types.add(p.ty); state.statuses.add(p.st);
    if (p.stage) state.stages.add(p.stage);
    state.minmw = 0; mm.value = 0; document.getElementById('minmwl').textContent = '0 MW';
    VIEW.clon = p.lon; VIEW.clat = p.lat; VIEW.k = Math.max(VIEW.k, 240);
    select(p); renderAll();
    res.hidden = true; qi.blur();
  });
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search')) res.hidden = true;
});

/* ============ outlook ============ */
function projections() {
  const years = [];
  for (let y = 2026; y <= 2033; y++) years.push(y);
  const adds = {}, addsRaw = {};
  years.forEach((y) => { adds[y] = {}; addsRaw[y] = {}; });
  for (const p of P) {
    if (p.st !== 'queue') continue;
    let y = p.cod || 2028;
    if (y < 2026) y = 2026;
    if (y > 2033) continue;
    const w = W[p.stage] ?? 0.2;
    adds[y][p.ty] = (adds[y][p.ty] || 0) + p.mw * w;
    addsRaw[y][p.ty] = (addsRaw[y][p.ty] || 0) + p.mw;
  }
  const rets = {};
  years.forEach((y) => {
    rets[y] = 0;
    const r = DATA.retire_by_year[String(y)];
    if (r) for (const k in r) rets[y] += r[k];
  });
  const base = {};
  for (const t of TYPES) base[t] = 0;
  for (const p of P) if (p.st === 'operating') base[p.ty] += p.mw;

  const traj = [];
  const cum = { ...base };
  traj.push({ year:2026, cap:{ ...cum }, total:Object.values(cum).reduce((a, b) => a + b, 0) });
  for (const y of years) {
    for (const t in adds[y]) cum[t] = (cum[t] || 0) + adds[y][t];
    const tot = Object.values(cum).reduce((a, b) => a + b, 0) - (rets[y] || 0);
    traj.push({ year:y + 1, cap:{ ...cum }, total:tot });
  }
  return { years, adds, addsRaw, base, traj, rets };
}

function svgBars(rows, opts) {
  // horizontal bars: rows = [{label, value, color, sub}]
  const w = opts.w || 560, rowH = 30, padL = opts.padL || 132, padR = 74;
  const h = rows.length * rowH + 12;
  const max = Math.max(...rows.map((r) => r.value), 1);
  let s = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" role="img">';
  rows.forEach((r, i) => {
    const y = i * rowH + 8, bw = Math.max(2, (r.value / max) * (w - padL - padR));
    s += '<text x="' + (padL - 9) + '" y="' + (y + 12) + '" text-anchor="end">' + esc(r.label) + '</text>';
    s += '<rect class="bar-seg" x="' + padL + '" y="' + y + '" width="' + bw + '" height="14" rx="4" fill="' + r.color + '"><title>'
      + esc(r.label) + ': ' + fmt(r.value) + ' MW</title></rect>';
    s += '<text class="val" x="' + (padL + bw + 8) + '" y="' + (y + 12) + '">' + (opts.gw ? gw(r.value) : fmt(r.value)) + '</text>';
    if (r.sub) s += '<text x="' + (padL - 9) + '" y="' + (y + 23) + '" text-anchor="end" style="font-size:9.5px;opacity:.65">' + esc(r.sub) + '</text>';
  });
  return s + '</svg>';
}

function svgStacked(traj) {
  const w = 900, h = 300, padL = 52, padB = 30, padT = 12, padR = 8;
  const max = Math.max(...traj.map((t) => t.total)) * 1.06;
  const iw = w - padL - padR, ih = h - padB - padT;
  const bw = Math.min(64, iw / traj.length - 12);
  let s = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" role="img">';
  for (let g = 0; g <= 4; g++) {
    const v = (max / 4) * g, y = padT + ih - (v / max) * ih;
    s += '<line class="gridline" x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '"/>';
    s += '<text class="val" x="' + (padL - 8) + '" y="' + (y + 3.5) + '" text-anchor="end">' + Math.round(v / 1000) + '</text>';
  }
  s += '<text x="' + (padL - 8) + '" y="' + (padT - 2) + '" text-anchor="end" style="font-size:9.5px">GW</text>';
  traj.forEach((t, i) => {
    const cx = padL + (iw / traj.length) * (i + 0.5), x = cx - bw / 2;
    let acc = 0;
    for (const ty of TYPES) {
      const v = t.cap[ty] || 0;
      if (v <= 0) continue;
      const bh = (v / max) * ih;
      const y = padT + ih - (acc / max) * ih - bh;
      s += '<rect class="bar-seg" x="' + x + '" y="' + (y + 1) + '" width="' + bw + '" height="' + Math.max(0, bh - 2) + '" fill="'
        + TYPE_COLOR[ty] + '" opacity=".9"><title>' + t.year + ' ' + TYPE_LABEL[ty] + ': ' + gw(v) + '</title></rect>';
      acc += v;
    }
    s += '<text x="' + cx + '" y="' + (h - 10) + '" text-anchor="middle">' + t.year + '</text>';
    s += '<text class="val" x="' + cx + '" y="' + (padT + ih - (t.total / max) * ih - 6) + '" text-anchor="middle" style="font-size:10px;fill:var(--ink-2)">'
      + Math.round(t.total / 1000) + '</text>';
  });
  return s + '</svg>';
}

function renderOutlook() {
  const pr = projections();
  const el = document.getElementById('outlook');
  const installedTotal = Object.values(pr.base).reduce((a, b) => a + b, 0);
  const queueTotal = P.filter((p) => p.st === 'queue').reduce((a, b) => a + b.mw, 0);
  const queueAdj = P.filter((p) => p.st === 'queue').reduce((a, b) => a + b.mw * (W[b.stage] ?? 0.2), 0);
  const end = pr.traj[pr.traj.length - 1];

  const instRows = TYPES.map((t) => ({ label:TYPE_LABEL[t], value:pr.base[t] || 0, color:TYPE_COLOR[t] }))
    .filter((r) => r.value > 0).sort((a, b) => b.value - a.value);

  const stageRows = STAGE_ORDER.filter((s) => DATA.stage_mw[s]).map((s) => {
    const raw = Object.values(DATA.stage_mw[s]).reduce((a, b) => a + b, 0);
    return { label:STAGE_LABEL[s], value:raw, color:'var(--c-neutral-bar)', sub:Math.round((W[s] ?? 0) * 100) + '% modelled' };
  });

  const legend = TYPES.filter((t) => (pr.base[t] || 0) > 0 || Object.values(pr.adds).some((a) => a[t]))
    .map((t) => '<span class="li"><span class="dot" style="background:' + TYPE_COLOR[t] + '"></span>' + TYPE_LABEL[t] + '</span>').join('');

  el.innerHTML =
  '<div class="wrap">'
  + '<h1>ERCOT capacity outlook</h1>'
  + '<p class="lede">ERCOT runs the grid for about 90% of Texas load as an energy-only, connect-and-manage market &mdash; interconnection is cheaper and faster than in most US ISOs, which is why its queue is the largest in the country. The queue is not a forecast: most of it never gets built. What follows separates what is <em>operating today</em> from what is <em>requested</em>, then discounts the queue by how far each project has actually progressed.</p>'

  + '<div class="card"><div class="hero">'
  + '<div><div class="h-v">' + gw(installedTotal) + '</div><div class="h-l">Operating capacity today</div></div>'
  + '<div><div class="h-v">' + gw(queueTotal) + '</div><div class="h-l">Requested in the queue</div></div>'
  + '<div><div class="h-v">' + gw(queueAdj) + '</div><div class="h-l">Risk-adjusted queue (' + Math.round(queueAdj / queueTotal * 100) + '% of requests)</div></div>'
  + '<div><div class="h-v">' + gw(end.total) + '</div><div class="h-l">Modelled capacity by ' + end.year + '</div></div>'
  + '</div></div>'

  + '<h2>Where the queue actually stands</h2>'
  + '<p class="sec-sub">ERCOT publishes a milestone trail for every request: screening study, full interconnection study, signed interconnection agreement (IA), financial security, construction, energization. Capacity sitting in early study is far less likely to reach commercial operation than capacity already under construction &mdash; the bars below are raw requested MW, annotated with the completion odds this model assigns each stage.</p>'
  + '<div class="card scroll-x">' + svgBars(stageRows, { gw:true, padL:168 }) + '</div>'

  + '<h2>Assumptions you can change</h2>'
  + '<p class="sec-sub">These weights drive every risk-adjusted number on this page and the map. They are a heuristic &mdash; informed by the fact that only a minority of queued capacity nationally reaches operation, and that ERCOT converts at a higher rate than most markets &mdash; not an ERCOT or EIA projection. Move them to your own view.</p>'
  + '<div class="card"><div id="weights"></div>'
  + '<div style="margin-top:12px;display:flex;gap:8px"><button class="btn" id="wreset">Reset to defaults</button>'
  + '<button class="btn" id="wzero">Only what is under construction</button></div></div>'

  + '<h2>Modelled installed capacity, ' + pr.traj[0].year + '&ndash;' + end.year + '</h2>'
  + '<p class="sec-sub">Operating fleet today, plus risk-adjusted queue additions in each project\'s projected commercial-operation year, less announced retirements. Stacked by fuel; labels are total GW.</p>'
  + '<div class="legend-inline">' + legend + '</div>'
  + '<div class="card scroll-x">' + svgStacked(pr.traj) + '</div>'

  + '<div class="grid2" style="margin-top:20px">'
  + '<div><h2 style="margin-top:0">Operating fleet today</h2>'
  + '<p class="sec-sub">Nameplate capacity by fuel, ERCOT balancing authority.</p>'
  + '<div class="card scroll-x">' + svgBars(instRows, { gw:true, w:480, padL:104 }) + '</div></div>'
  + '<div><h2 style="margin-top:0">Risk-adjusted additions by year</h2>'
  + '<p class="sec-sub">Queue capacity discounted by stage, bucketed on projected COD.</p>'
  + '<div class="card scroll-x"><table class="tbl"><thead><tr><th>Year</th><th class="n">Requested</th><th class="n">Risk-adjusted</th><th class="n">Retirements</th></tr></thead><tbody>'
  + pr.years.map((y) => {
      const raw = Object.values(pr.addsRaw[y] || {}).reduce((a, b) => a + b, 0);
      const adj = Object.values(pr.adds[y] || {}).reduce((a, b) => a + b, 0);
      return '<tr><td class="mono">' + y + '</td><td class="n">' + gw(raw) + '</td><td class="n">' + gw(adj)
        + '</td><td class="n" style="color:var(--ink-3)">' + (pr.rets[y] ? '&minus;' + fmt(pr.rets[y]) + ' MW' : '&mdash;') + '</td></tr>';
    }).join('')
  + '</tbody></table></div></div></div>'

  + '<h2>How to read this, and what it will not tell you</h2>'
  + '<div class="card"><table class="tbl"><tbody>'
  + '<tr><td style="width:210px;color:var(--ink-3)">Queue project locations</td><td>ERCOT reports queue projects at <b>county level only</b>. Those dots are placed inside the right county but not at the real site. Operating and planned plants use exact EIA coordinates.</td></tr>'
  + '<tr><td style="color:var(--ink-3)">Capacity basis</td><td>Nameplate MW throughout. Storage is shown at power rating, not energy &mdash; a 100 MW / 400 MWh battery counts as 100 MW.</td></tr>'
  + '<tr><td style="color:var(--ink-3)">Double counting</td><td>A project can appear both as an ERCOT queue entry and an EIA planned plant. Toggle "Planned" off on the map to avoid counting it twice.</td></tr>'
  + '<tr><td style="color:var(--ink-3)">Not modelled</td><td>Transmission limits and congestion, curtailment, unannounced retirements, load growth from data centres and electrification, and the capacity value of intermittent resources. Nameplate GW is not firm capacity.</td></tr>'
  + '<tr><td style="color:var(--ink-3)">Retirements</td><td>Only retirements operators have <b>already announced</b> to EIA. Historically the real number runs higher.</td></tr>'
  + '</tbody></table></div>'

  + '<div class="foot">Sources: <b>' + esc(DATA.meta.ercot_report) + '</b> &mdash; the interconnection queue, milestones and projected COD dates. '
  + '<b>' + esc(DATA.meta.eia_report) + '</b> &mdash; the operating, planned and retired fleet with plant coordinates, filtered to the ERCO balancing authority. '
  + 'County boundaries from the US Census Bureau. Built ' + esc(DATA.meta.generated) + '. '
  + DATA.meta.queue_n.toLocaleString() + ' queue projects &middot; ' + DATA.meta.operating_n.toLocaleString() + ' operating plants &middot; '
  + DATA.meta.planned_n.toLocaleString() + ' planned &middot; ' + DATA.meta.retired_n.toLocaleString() + ' retired.<br>'
  + 'Completion-probability weights are this tool\'s assumption, not a published ERCOT or EIA forecast. Treat every forward number as a scenario.</div>'
  + '</div>';

  renderWeights();
}

function renderWeights() {
  const host = document.getElementById('weights');
  if (!host) return;
  const present = STAGE_ORDER.filter((s) => DATA.stage_mw[s]);
  host.innerHTML = present.map((s) =>
    '<div class="wt"><span class="wt-l">' + STAGE_LABEL[s] + '</span>'
    + '<input type="range" min="0" max="100" step="1" value="' + Math.round((W[s] ?? 0) * 100) + '" data-s="' + s + '">'
    + '<span class="wt-v" id="wv-' + s + '">' + Math.round((W[s] ?? 0) * 100) + '%</span></div>').join('');
  host.querySelectorAll('input').forEach((inp) => {
    inp.oninput = () => {
      W[inp.dataset.s] = +inp.value / 100;
      document.getElementById('wv-' + inp.dataset.s).textContent = inp.value + '%';
      clearTimeout(window._wt);
      window._wt = setTimeout(() => { renderOutlook(); renderStats(); }, 130);
    };
  });
  const rst = document.getElementById('wreset');
  if (rst) rst.onclick = () => { W = { ...DEFAULT_W }; renderOutlook(); renderStats(); };
  const zer = document.getElementById('wzero');
  if (zer) zer.onclick = () => {
    W = {};
    for (const k in DEFAULT_W) W[k] = 0;
    W.under_construction = 0.9; W.energization_approved = 0.95; W.synchronized = 0.98;
    renderOutlook(); renderStats();
  };
}

function onThemeChange() {
  refreshTheme();
  draw();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onThemeChange);
new MutationObserver(onThemeChange).observe(document.documentElement, { attributeFilter:['data-theme'] });

refreshTheme();
requestAnimationFrame(() => { resize(); fitTexas(); renderAll(); });
</script>
