# Speaker Signal demo stack — MongoDB Atlas only (no local Postgres/Mongo).
# Requires MONGODB_URI (and optional OPENAI_API_KEY) in root .env.
# Usage: docker compose up --build
#
# Dashboard  http://localhost:3000  (speaker-signal Signal Desk)
# Ingestion  http://localhost:8001
# Intelligence http://localhost:8002
# GTM        http://localhost:8003  (Zoho SMTP via root .env SEND_MODE/SMTP_*)
#
# Note: `gtm` builds from ./gtm-service (Node/Fastify). Do not point this
# service at agents/agent3 — that Python stack is separate.
# Optional ERCOT Atlas / landing fork lives under frontend/ and is not Compose.

services:
  ingestion:
    build:
      context: ./speaker-signal-ingestion
    image: speaker-signal-ingestion
    container_name: speaker-signal-ingestion
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      INGESTION_PORT: "8001"
      HOST: "0.0.0.0"
      MONGODB_DB: speaker_signal_ingestion
      BOOTSTRAP_SEEDS: "https://www.7x24exchange.org/,https://www.datacenterworld.com/,https://infrastructuremasons.org/events/"
      BOOTSTRAP_MAX_PER_SEED: "10"
      AUTO_INGEST_ENABLED: "true"
      AUTO_INGEST_CONCURRENCY: "3"
      HANDOFF_ENABLED: "true"
      INTELLIGENCE_URL: "http://intelligence:8002"
    depends_on:
      intelligence:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  intelligence:
    build:
      context: ./intelligence-service
    image: intelligence-service
    container_name: intelligence-service
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      INTELLIGENCE_PORT: "8002"
      HOST: "0.0.0.0"
      MONGODB_DB: speaker_signal_intelligence
      INGESTION_URL: "http://ingestion:8001"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:8002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  gtm:
    build:
      context: ./gtm-service
    image: gtm-service
    container_name: gtm-service
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      GTM_PORT: "8003"
      HOST: "0.0.0.0"
      MONGODB_DB: speaker_signal_gtm
      # Zoho SMTP — interpolated from root .env (keep SMTP_PASSWORD quoted there if it contains #)
      SEND_MODE: ${SEND_MODE:-mock}
      SENDER_NAME: ${SENDER_NAME:-Kirill Cheldishkin}
      SENDER_COMPANY: ${SENDER_COMPANY:-Candid}
      SENDER_EMAIL: ${SENDER_EMAIL:-info@jobersteadt.com}
      TEST_TO_EMAIL: ${TEST_TO_EMAIL:-faruquitaymur@gmail.com}
      SMTP_HOST: ${SMTP_HOST:-smtp.zoho.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-info@jobersteadt.com}
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:8003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  dashboard:
    build:
      context: ./speaker-signal
      args:
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
    image: speaker-signal-dashboard
    container_name: speaker-signal-dashboard
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      INGESTION_API_URL: "http://ingestion:8001"
      INTELLIGENCE_API_URL: "http://intelligence:8002"
      GTM_API_URL: "http://gtm:8003"
      INGESTION_URL: "http://ingestion:8001"
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
    depends_on:
      ingestion:
        condition: service_started
      intelligence:
        condition: service_started
      gtm:
        condition: service_started
    restart: unless-stopped
