services:
  ingestion:
    build:
      context: .
    image: speaker-signal-ingestion
    container_name: speaker-signal-ingestion
    ports:
      - "8001:8001"
    # Single source of truth for OPENAI_API_KEY / MONGODB_URI etc. lives in the
    # shared backend/.env. No service-local .env is used.
    env_file:
      - ../backend/.env
    environment:
      # Keep Agent 1 on 8001 regardless of any generic PORT in backend/.env.
      INGESTION_PORT: "8001"
      HOST: "0.0.0.0"
      # Start grabbing on boot: discover from these seeds, then auto-ingest every
      # relevant hit. Override or clear BOOTSTRAP_SEEDS to change what it crawls.
      BOOTSTRAP_SEEDS: "https://www.7x24exchange.org/,https://www.datacenterworld.com/,https://infrastructuremasons.org/events/"
      BOOTSTRAP_MAX_PER_SEED: "10"
      AUTO_INGEST_ENABLED: "true"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
