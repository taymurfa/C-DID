# GridConnects — Render Blueprint
# Signal Desk (speaker-signal) + Agent 1 (ingestion) + Agent 2 (intelligence) + Agent 3 (GTM)
#
# Connect: Render → New → Blueprint → this repo / branch Jobersteadt
# Docs: docs/RENDER.md
#
# Secrets use sync: false — set them once in the Render dashboard after create.
# Render injects env vars as Docker build args (needed for NEXT_PUBLIC_*).

services:
  # --- Agent 2: Intelligence (qualify / score) ---------------------------------
  - type: web
    name: gridconnects-intelligence
    runtime: docker
    plan: free
    repo: https://github.com/taymurfa/C-DID
    branch: Jobersteadt
    dockerfilePath: ./intelligence-service/Dockerfile
    dockerContext: ./intelligence-service
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: MONGODB_DB
        value: speaker_signal_intelligence
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  # --- Agent 1: Ingestion (Playwright — needs more than free-tier disk/RAM) ----
  - type: web
    name: gridconnects-ingestion
    runtime: docker
    plan: starter
    repo: https://github.com/taymurfa/C-DID
    branch: Jobersteadt
    dockerfilePath: ./speaker-signal-ingestion/Dockerfile
    dockerContext: ./speaker-signal-ingestion
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: MONGODB_DB
        value: speaker_signal_ingestion
      - key: AUTO_INGEST_ENABLED
        value: "true"
      - key: HANDOFF_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: INTELLIGENCE_URL
        fromService:
          name: gridconnects-intelligence
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # --- Agent 3: GTM (sequences + Zoho SMTP) ------------------------------------
  - type: web
    name: gridconnects-gtm
    runtime: docker
    plan: free
    repo: https://github.com/taymurfa/C-DID
    branch: Jobersteadt
    dockerfilePath: ./gtm-service/Dockerfile
    dockerContext: ./gtm-service
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: MONGODB_DB
        value: speaker_signal_gtm
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Locked draft-only on Render — sequences never auto-send; SMTP mock only.
      - key: SEND_MODE
        value: mock
      - key: SENDER_NAME
        value: Kirill Cheldishkin
      - key: SENDER_COMPANY
        value: Candid
      - key: SENDER_EMAIL
        sync: false
      - key: SMTP_HOST
        value: smtp.zoho.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TEST_TO_EMAIL
        value: faruquitaymur@gmail.com

  # --- GridConnects web (Signal Desk) -----------------------------------------
  - type: web
    name: gridconnects
    runtime: docker
    plan: free
    repo: https://github.com/taymurfa/C-DID
    branch: Jobersteadt
    dockerfilePath: ./speaker-signal/Dockerfile
    dockerContext: ./speaker-signal
    healthCheckPath: /
    envVars:
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: INGESTION_API_URL
        fromService:
          name: gridconnects-ingestion
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: INGESTION_URL
        fromService:
          name: gridconnects-ingestion
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: INTELLIGENCE_API_URL
        fromService:
          name: gridconnects-intelligence
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GTM_API_URL
        fromService:
          name: gridconnects-gtm
          type: web
          envVarKey: RENDER_EXTERNAL_URL
